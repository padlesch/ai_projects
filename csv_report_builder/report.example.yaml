# Пример настроек для отчётов АПП (то, что в build_app_excel12.py было зашито в код).
# Положите report.yaml в папку с CSV. Все поля необязательны; полный шаблон с вашими файлами: --init

book:
  title: "Распределение амбулаторных услуг в стационарах"
  subtitle: "ЗЛ, ДЗМ, Взрослые стационары, без подушевого финансирования, без МРВСМ"
  period: "9м"                    # шапка: «2026 9м», «2025 9м»
  notes:
    - "Случаи/Пациенты — уникальные GID/PAT_ID на каждой строке; суммы в млн руб."
    - "Δ% = 2026 / 2025 − 1; больше 200% — «> 200%», при 2025 = 0 — пусто."

coloring:
  positive_is: bad                # рост — красный, снижение — зелёный
  columns: ["Δ Случаи", "Δ Пациентов", "Δ Сумма объёмы*"]   # как в АПП: красить только эти

columns:
  MO_NAME: {label: "МО"}
  GROUP_NAME: {label: "Группа отделений"}
  "OTD*NAME": {label: "Отделение"}             # OTD_NAME, OTD_PROF_NAME, OTD_PROF_K_NAME — один уровень «Отделение»
  "re:^SRV_(CODE|NAME)$": {label: "Услуга"}
  "Δ Сумма всего, млн руб": {description: "Δ всего = Δ объёмы + Δ индексация"}

files:
  "re:^rep_app_stac_1_\\d{8,}\\.csv$": {sheet: "1 Группы отделений", description: "Группы отделений"}
  "rep_app_stac_1_1_*": {sheet: "1.1 Группы, спец по направившим",
                         description: "Группы отделений — специсследования по направившим"}
  "rep_app_stac_emias_1_4_*":
    sheet: "1.4 ЕМИАС Группы, спец по своим"
    subtitle: "ЗЛ, ДЗМ, без МРВСМ; группы отделений — ЕМИАС (ТАПКЕЙС → МОСДОК → ПУМП)"
    order: "1.4.1"                # встать сразу за 1.4
  "rep_app_stac_10_1_*":
    sheet: "10.1 ЦАР и спортмедицина"
    subtitle: "ЗЛ, ДЗМ, Взрослые стационары, без подушевого финансирования, включая МРВСМ"
  "*черновик*": {skip: true}
